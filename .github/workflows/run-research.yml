name: Run NIFTY-100 research

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'configs/**'
      - '.github/workflows/run-research.yml'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: nifty100-research
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pyarrow pyyaml requests beautifulsoup4 tqdm pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run unit and leakage tests
        run: |
          python -m compileall -q scripts
          pytest -q tests/test_strategy_math.py tests/test_data.py

      - name: Fetch point-in-time membership
        run: |
          git clone --depth 1 https://github.com/aditya-jha/nse-historical-membership.git /tmp/nse-membership
          cp /tmp/nse-membership/index_history/data/index_membership_history.csv data/processed/index_membership_history.csv

      - name: Restore pinned NSE EOD snapshot
        id: nse-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nse-db/data
          key: nse-eod-a13d8112c71528183fff44ac8b27a1458bea3da4

      - name: Fetch pinned NSE EOD snapshot
        if: steps.nse-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch data --single-branch https://github.com/ancap97/NSEDATA4ME.git /tmp/nse-snapshot
          mkdir -p /tmp/nse-db
          mv /tmp/nse-snapshot/data /tmp/nse-db/data

      - name: Save NSE EOD snapshot cache
        if: always() && steps.nse-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/nse-db/data
          key: nse-eod-a13d8112c71528183fff44ac8b27a1458bea3da4

      - name: Restore prepared NIFTY-100 dataset
        id: dataset-cache
        uses: actions/cache/restore@v4
        with:
          path: data/processed/nifty100_adjusted_prices.parquet
          key: nifty100-adjusted-v1-2014-01-01-2026-09-23

      - name: Fetch NSEDATA4ME loader code
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --single-branch https://github.com/ancap97/NSEDATA4ME.git /tmp/nse-code
          rm -rf /tmp/nse-code/data
          ln -s /tmp/nse-db/data /tmp/nse-code/data

      - name: Build adjusted NIFTY-100 dataset
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/prepare_nifty100_dataset.py \
            --nse-code /tmp/nse-code \
            --membership data/processed/index_membership_history.csv \
            --out data/processed \
            --start 2014-01-01 \
            --end 2026-09-23

      - name: Save prepared NIFTY-100 dataset cache
        if: always() && steps.dataset-cache.outputs.cache-hit != 'true' && hashFiles('data/processed/nifty100_adjusted_prices.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: data/processed/nifty100_adjusted_prices.parquet
          key: nifty100-adjusted-v1-2014-01-01-2026-09-23

      - name: Run full PCA CNN Transformer walk-forward backtest
        run: |
          mkdir -p results/generated
          python scripts/run_pca_cnn_transformer.py \
            --eod data/processed/nifty100_adjusted_prices.parquet \
            --membership data/processed/index_membership_history.csv \
            --out results/generated \
            --start 2014-01-01 \
            --oos-start 2019-01-02 \
            --end 2026-09-23 \
            --epochs 100 \
            --log results/generated/progress.jsonl \
            2>&1 | tee results/generated/backtest.log

      - name: Upload results and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty100-deep-stat-arb-results-${{ github.run_id }}
          path: |
            results/generated/
            data/processed/nifty100_adjusted_prices.parquet
          retention-days: 90
