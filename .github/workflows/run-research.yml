name: Run NIFTY-100 research

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pyarrow torch pyyaml requests beautifulsoup4 tqdm
      - name: Fetch point-in-time membership
        run: |
          git clone --depth 1 https://github.com/aditya-jha/nse-historical-membership.git /tmp/nse-history
          cp /tmp/nse-history/index_history/data/index_membership_history.csv data/processed/index_membership_history.csv
      - name: Fetch NSE cash-market EOD data
        run: |
          git clone --depth 1 https://github.com/aditya-jha/nse-historical-membership.git /tmp/nse-history-code
          cd /tmp/nse-history-code
          python -m nse_eod.code.fetch_bhavcopy --start 2020-01-01 --end 2026-05-15
          python -m nse_eod.code.build_daily_ohlc
          cp data/_daily_ohlc.parquet "$GITHUB_WORKSPACE/data/processed/nse_daily_ohlc.parquet"
      - name: Run PCA CNN Transformer walk-forward backtest
        run: |
          python scripts/run_pca_cnn_transformer.py --eod data/processed/nse_daily_ohlc.parquet --membership data/processed/index_membership_history.csv --out results/generated --start 2020-01-01 --oos-start 2024-01-02 --end 2026-05-15
      - name: Save results artifact
        uses: actions/upload-artifact@v4
        with:
          name: nifty100-deep-stat-arb-results
          path: results/generated/
          retention-days: 30
