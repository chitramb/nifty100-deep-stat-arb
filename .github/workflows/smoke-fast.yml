name: Fast CPU Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [debug/fast-smoke-test]

concurrency:
  group: nifty100-fast-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pyyaml
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Verify imports
        run: |
          python - <<'PY'
          import numpy, pandas, scipy, sklearn, torch
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('scipy', scipy.__version__)
          print('sklearn', sklearn.__version__)
          print('torch', torch.__version__)
          print('torch.cuda.is_available()', torch.cuda.is_available())
          PY

      - name: Run unit and leakage tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -m pytest -q tests

      - name: Run tiny end-to-end smoke test
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/run_pca_cnn_transformer.py \
            --epochs 2 \
            --train-days 252 \
            --oos-days 20 \
            --max-oos-blocks 1 \
            --batch-size 16 \
            --output-dir smoke_results

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-smoke-results
          path: smoke_results/
          if-no-files-found: warn
